<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg,#fff4f1);-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head><title>廣島冬遊記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Chiron+GoRound+TC:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: illustrated seaside hero → trip chips → day "ticket" tabs → one day's dotted timeline */
:root{
  --bg:#fff4f1;          /* sakura washi */
  --paper:#ffffff;
  --ink:#33395a;         /* indigo ink */
  --ink-soft:#6f7395;
  --line:#f0d9d3;
  --torii:#e5574a;       /* vermilion */
  --torii-soft:#fde3df;
  --sea:#8ecbe8;
  --sea-deep:#5aa7d0;
  --matcha:#86b98a;
  --sun:#ffcf6b;
  --deer:#c98b5a;
  --c-move:#5aa7d0; --c-food:#f19a4b; --c-sight:#e5574a; --c-spa:#3fae9e; --c-shop:#9a7fd1;
  --c-move-bg:#e3f2fa; --c-food-bg:#fdeedf; --c-sight-bg:#fde3df; --c-spa-bg:#ddf3ef; --c-shop-bg:#eee8fa;
  --tip-bg:#fff8e4; --tip-line:#f3dc9c;
  --shadow:0 3px 0 #f0d9d3;
  --f-display:"Huninn","Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Chiron GoRound TC","Huninn","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-jp:"Zen Maru Gothic","Huninn",sans-serif;
  --f-num:"Zen Maru Gothic","Chiron GoRound TC",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1d2238; --paper:#272e4b; --ink:#f6ece6; --ink-soft:#b6b4cc; --line:#3a4266;
  --torii:#ff7a6b; --torii-soft:#4a2f3e; --sea:#4f86a8; --sea-deep:#7cc0e3; --matcha:#7fb487; --sun:#ffd27a; --deer:#d9a274;
  --c-move:#7cc0e3; --c-food:#f7ab66; --c-sight:#ff7a6b; --c-spa:#5fcab9; --c-shop:#b49cec;
  --c-move-bg:#2a3d55; --c-food-bg:#47372e; --c-sight-bg:#4a2f3e; --c-spa-bg:#24433f; --c-shop-bg:#383058;
  --tip-bg:#3a3528; --tip-line:#6b5d34; --shadow:0 3px 0 #141829; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d2238; --paper:#272e4b; --ink:#f6ece6; --ink-soft:#b6b4cc; --line:#3a4266;
  --torii:#ff7a6b; --torii-soft:#4a2f3e; --sea:#4f86a8; --sea-deep:#7cc0e3; --matcha:#7fb487; --sun:#ffd27a; --deer:#d9a274;
  --c-move:#7cc0e3; --c-food:#f7ab66; --c-sight:#ff7a6b; --c-spa:#5fcab9; --c-shop:#b49cec;
  --c-move-bg:#2a3d55; --c-food-bg:#47372e; --c-sight-bg:#4a2f3e; --c-spa-bg:#24433f; --c-shop-bg:#383058;
  --tip-bg:#3a3528; --tip-line:#6b5d34; --shadow:0 3px 0 #141829; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:22px 22px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:22px}

/* Hero */
/* Hero: compact two-part card — title on wave-patterned paper, illustration window on the right */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);border-radius:26px;overflow:hidden;background:var(--paper);border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.hero-text{padding:18px 20px;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0;
  background-color:var(--paper);
  background-image:radial-gradient(circle at 50% 100%,transparent 9px,var(--line) 10px,var(--line) 11px,transparent 12px),radial-gradient(circle at 50% 100%,transparent 4px,var(--line) 5px,var(--line) 6px,transparent 7px);
  background-size:24px 12px;background-position:0 100%;background-repeat:repeat-x;padding-bottom:26px}
.hero-jp{font-family:var(--f-jp);font-weight:700;font-size:13px;color:var(--torii);letter-spacing:.14em}
.hero h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5.4vw,40px);line-height:1.15;color:var(--ink)}
.squiggle{width:96px;height:9px;display:block}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-family:var(--f-num);font-weight:700;font-size:12px;padding:2px 10px;border-radius:99px;border:1.5px solid var(--ink);background:var(--paper);white-space:nowrap}
.pill.soft{background:var(--torii-soft)}
.hero-art{position:relative;border-left:2.5px solid var(--ink);min-height:200px}
.hero-art > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.crew{position:absolute;right:8px;bottom:6px;display:flex;gap:4px}
.crew figure{margin:0;display:flex;flex-direction:column;align-items:center;animation:bob 2.6s ease-in-out infinite}
.crew figure + figure{animation-delay:.4s}
.crew svg{width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid #33395a;display:block}
.crew figcaption{margin-top:-6px;font-size:11px;font-weight:700;color:#fff;background:#33395a;border-radius:99px;padding:0 7px;line-height:1.6;position:relative}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.crew figure{animation:none}}
@media (max-width:560px){
  .hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
  .hero-text{padding:14px 14px 24px}
  .hero-art{min-height:150px}
  .crew svg{width:36px;height:36px}
  .pill{font-size:11px;padding:1px 8px;white-space:normal}
}

/* Chips */
.info{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px}
.chip.flights .rows{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.chip.flights .rows > div + div{border-top:1.5px dashed var(--line);padding-top:8px}
.chip .sub{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--ink-soft)}
/* Travelers strip inside the hero card */
.chip{background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;min-width:0;box-shadow:var(--shadow)}
.chip svg{flex:none;width:34px;height:34px}
.chip b{display:block;font-size:13px;color:var(--ink-soft);font-weight:400}
.chip span{display:block;font-family:var(--f-num);font-weight:700;font-size:14px;line-height:1.35}
@media (max-width:640px){.info{grid-template-columns:1fr}}

/* Day tabs */
/* Day tabs: compact pills — number badge + date side by side (stacked on phones) */
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tab{appearance:none;font:inherit;color:var(--ink);cursor:pointer;background:var(--paper);border:2px solid var(--ink);border-radius:16px;
  padding:7px 8px;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;transition:background .15s,box-shadow .15s}
.tab:hover{background:var(--torii-soft)}
.tab:focus-visible{outline:3px dashed var(--torii);outline-offset:3px}
.tab .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--torii-soft);color:var(--torii);
  font-family:var(--f-num);font-weight:700;font-size:17px;line-height:1}
.tab .txt{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.tab .dt{font-family:var(--f-num);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.tab .wd{font-size:12px;color:var(--ink-soft)}
.tab[aria-selected="true"]{background:var(--torii);color:#fff;box-shadow:0 3px 0 var(--ink)}
.tab[aria-selected="true"] .n{background:#fff;color:var(--torii)}
.tab[aria-selected="true"] .wd{color:#ffe3de}
@media (max-width:560px){
  .tab{flex-direction:column;gap:3px;padding:6px 2px;border-radius:14px}
  .tab .n{width:26px;height:26px;font-size:15px}
  .tab .txt{align-items:center}
  .tab .dt{font-size:12px}.tab .wd{display:none}
}

/* Sticky day bar: solid strip; the upward shadow also covers the safe-area gap above it */
.daybar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:10px 16px;display:flex;gap:8px;align-items:stretch;
  border-bottom:2px dashed var(--line)}
.daybar .tabs{flex:1;min-width:0}
/* Only once stuck: shadow below, and a strip filling the safe-area gap above */
.daybar.stuck{box-shadow:0 8px 12px -10px rgba(51,57,90,.45)}
.daybar.stuck::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:env(safe-area-inset-top,0px);background:var(--bg)}
.jump{appearance:none;font:inherit;cursor:pointer;color:var(--ink);background:var(--c-spa-bg);border:2px dashed var(--ink);border-radius:16px;padding:6px 10px;display:flex;align-items:center;justify-content:center;gap:6px;flex:none}
.jump .kana{font-family:var(--f-jp);font-weight:700;font-size:20px;line-height:1;color:var(--c-spa)}
.jump .lb{font-size:13px;font-weight:700}
.jump:hover{background:var(--c-spa);color:#fff}.jump:hover .kana{color:#fff}
.jump:focus-visible{outline:3px dashed var(--torii);outline-offset:3px}
@media (max-width:560px){.daybar{gap:6px}.tabs{gap:5px}.jump{flex-direction:column;gap:2px;padding:6px 6px;border-radius:14px}.jump .kana{font-size:16px}.jump .lb{font-size:11px}}

/* Phrasebook */
.phr{background:var(--paper);border:2.5px solid var(--ink);border-radius:26px;padding:22px clamp(16px,4vw,32px) 26px;box-shadow:6px 6px 0 var(--ink)}
.phr-head .jp{font-family:var(--f-jp);font-weight:700;color:var(--c-spa);font-size:14px;letter-spacing:.1em}
.phr-head h2{margin:2px 0 4px;font-family:var(--f-display);font-weight:400;font-size:clamp(21px,4.4vw,28px)}
.phr-head p{margin:0;color:var(--ink-soft);font-size:14px}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 16px}
.cat{appearance:none;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:99px;padding:3px 14px}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.cat:focus-visible{outline:3px dashed var(--torii);outline-offset:2px}
.plist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.plist{grid-template-columns:1fr}}
.ph{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start;background:var(--bg);border-radius:16px;padding:10px 12px;border:1.5px solid var(--line)}
.ph .ja{font-family:var(--f-jp);font-weight:700;font-size:17px;line-height:1.45}
.ph .kana{font-family:var(--f-jp);font-size:13px;color:var(--ink-soft);grid-column:1}
.ph .zh{font-size:15px;grid-column:1}
.ph .ctag{font-size:11px;font-weight:700;color:var(--c-spa);margin-right:6px}
.say{grid-row:1 / span 3;grid-column:2;appearance:none;cursor:pointer;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);color:var(--ink);display:grid;place-items:center}
.say:hover{background:var(--c-spa);color:#fff}
.say:focus-visible{outline:3px dashed var(--torii);outline-offset:2px}
.say svg{width:16px;height:16px}
.today{margin-top:18px;border:2px solid var(--ink);border-radius:20px;padding:14px 16px;background:var(--c-spa-bg)}
.today-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.today h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:18px}
.today .ph{background:var(--paper)}
.more{appearance:none;font:inherit;font-size:14px;font-weight:700;color:var(--c-spa);background:none;border:0;padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.more:focus-visible{outline:3px dashed var(--torii);outline-offset:2px}

/* Day panel */
.panel{background:var(--paper);border:2.5px solid var(--ink);border-radius:26px;padding:22px clamp(16px,4vw,32px) 26px;box-shadow:6px 6px 0 var(--ink)}
.panel-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start;border-bottom:2px dashed var(--line);padding-bottom:16px}
.panel-head .jp{font-family:var(--f-jp);font-weight:700;color:var(--torii);font-size:14px;letter-spacing:.1em}
.panel-head h2{margin:2px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(21px,4.4vw,28px);line-height:1.3;text-wrap:balance}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-num);font-weight:700;font-size:13px;padding:4px 12px;border-radius:99px;background:var(--c-move-bg);border:1.5px solid var(--ink)}
.badge.alt{background:var(--torii-soft)}
.badge svg{width:18px;height:18px}

.timeline{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.ev{display:grid;grid-template-columns:62px 40px minmax(0,1fr);align-items:start;position:relative}
.ev .time{font-family:var(--f-num);font-weight:700;font-size:16px;text-align:right;padding-top:8px;font-variant-numeric:tabular-nums;line-height:1.2}
.ev .time small{display:block;font-size:12px;color:var(--ink-soft);font-weight:500}
.ev .dot{justify-self:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:var(--k-bg);position:relative;z-index:1;margin-top:2px}
.ev .dot svg{width:20px;height:20px;color:var(--k)}
.ev:not(:last-child)::before{content:"";position:absolute;left:calc(62px + 20px - 1px);top:36px;bottom:-16px;border-left:2.5px dotted var(--ink-soft)}
.ev .card{border-radius:16px;padding:10px 14px;background:var(--k-bg);border:1.5px solid transparent;min-width:0}
.ev .tag{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--k);border-radius:99px;padding:0 10px;margin-right:6px;vertical-align:2px}
.ev h3{display:inline;font-family:var(--f-display);font-weight:400;font-size:17px;margin:0}
.tips h4,.tide h4{font-family:var(--f-display);font-weight:400}

/* Tide card (Day 3) */
.tide{margin-top:22px;border:2px solid var(--ink);border-radius:20px;padding:16px 18px;background:var(--c-move-bg)}
.tide-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tide h4{margin:0;font-size:18px}
.tide .src{font-size:12px;color:var(--ink-soft)}
.tide-chart{overflow-x:auto;margin-top:8px}
.tide-chart svg{display:block;width:100%;min-width:520px;height:auto}
.tide-legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.tide-legend div{background:var(--paper);border-radius:12px;padding:6px 10px;border:1.5px solid var(--line);min-width:0}
.tide-legend b{display:block;font-size:12px;color:var(--ink-soft);font-weight:400}
.tide-legend span{font-family:var(--f-num);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.tide-legend .hi span{color:var(--sea-deep)}
.tide-legend .lo span{color:var(--c-food)}
.tide p{margin:10px 0 0;font-size:15px}
@media (max-width:560px){.tide-legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ev p{margin:4px 0 0;color:var(--ink-soft);font-size:15px}
.k-move{--k:var(--c-move);--k-bg:var(--c-move-bg)}
.k-food{--k:var(--c-food);--k-bg:var(--c-food-bg)}
.k-sight{--k:var(--c-sight);--k-bg:var(--c-sight-bg)}
.k-spa{--k:var(--c-spa);--k-bg:var(--c-spa-bg)}
.k-shop{--k:var(--c-shop);--k-bg:var(--c-shop-bg)}
@media (max-width:480px){.ev{grid-template-columns:50px 36px minmax(0,1fr)}.ev:not(:last-child)::before{left:calc(50px + 18px - 1px)}.ev .time{font-size:14px}.ev .dot{width:30px;height:30px}}

.tips{margin-top:22px;background:var(--tip-bg);border:2px dashed var(--tip-line);border-radius:18px;padding:14px 18px;display:flex;gap:12px}
.tips svg{flex:none;width:44px;height:44px}
.tips h4{margin:0 0 4px;font-size:16px}
.tips ul{margin:0;padding-left:1.1em}
.tips li{margin:2px 0}
.tips li.mine::marker{content:"★ ";color:var(--torii)}

.check{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.check label{display:inline-flex;gap:6px;align-items:center;background:var(--torii-soft);border-radius:99px;padding:4px 12px;font-size:14px;cursor:pointer}
.check input{accent-color:var(--torii)}

.memo{margin-top:16px}
.memo label{font-size:14px;color:var(--ink-soft);display:block;margin-bottom:4px}
.memo textarea{width:100%;min-height:68px;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:10px 12px;resize:vertical}
.memo textarea:focus{outline:none;border-color:var(--torii)}

.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.nav button{appearance:none;font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:99px;padding:6px 16px;cursor:pointer}
.nav button:hover{background:var(--torii-soft)}
.nav button:focus-visible{outline:3px dashed var(--torii);outline-offset:2px}
.nav button[disabled]{opacity:.35;cursor:default}

.panel.swap .timeline > li{animation:pop .4s both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel.swap .timeline > li{animation:none}.tab{transition:none}}

footer{text-align:center;color:var(--ink-soft);font-size:13px;font-family:var(--f-jp);font-weight:700}
.hero h1{font-family:var(--f-display)}
.tab .n{font-family:var(--f-num);font-weight:700}
.deer-walk{display:inline-block;vertical-align:middle;width:46px;height:40px}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-plane" viewBox="0 0 24 24"><path fill="currentColor" d="M21 15.5v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0v5l-8 5v2l8-2.5v5l-2 1.5v1.5l3.5-1 3.5 1v-1.5l-2-1.5v-5z"/></symbol>
    <symbol id="i-bus" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="15" rx="3" fill="currentColor"/><rect x="6.5" y="5.5" width="11" height="6" rx="1.5" fill="#fff"/><circle cx="8" cy="15" r="1.3" fill="#fff"/><circle cx="16" cy="15" r="1.3" fill="#fff"/><rect x="6" y="18" width="3" height="3" rx="1" fill="currentColor"/><rect x="15" y="18" width="3" height="3" rx="1" fill="currentColor"/></symbol>

function tideCard(t){
  const W=600, H=210, L=44, R=14, T=16, B=30, ymin=-50, ymax=400;
  const x = h => L + h*(W-L-R)/24;
  const y = v => T + (ymax-v)*(H-T-B)/(ymax-ymin);
  const pts = t.hourly.map((v,h)=>[x(h),y(v)]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let k=1;k<pts.length;k++){ const [x0,y0]=pts[k-1],[x1,y1]=pts[k],mx=(x0+x1)/2; d+=` C${mx},${y0} ${mx},${y1} ${x1},${y1}`; }
  const area = d + ` L${pts[pts.length-1][0]},${y(ymin)} L${pts[0][0]},${y(ymin)} Z`;
  const grid = [0,100,200,300,400].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink-soft)">${v}</text>`).join("");
  const hours = [0,3,6,9,12,15,18,21,24].map(h=>`<text x="${x(h)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--ink-soft)">${h}時</text>`).join("");
  const band = (v,label,col,left)=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${col}" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${left?L+4:W-R-4}" y="${y(v)-5}" text-anchor="${left?"start":"end"}" font-size="11" font-weight="700" fill="${col}">${label}</text>`;
  const stay = `<rect x="${x(10.5)}" y="${T}" width="${x(16)-x(10.5)}" height="${y(ymin)-T}" fill="var(--torii)" opacity=".1"/><text x="${(x(10.5)+x(16))/2}" y="${y(ymin)-6}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--torii)">在宮島 10:30–16:00</text>`;
  const marks = t.marks.map(([k,lab,h,v])=>{const c=k==="hi"?"var(--sea-deep)":"var(--c-food)";return `<circle cx="${x(h)}" cy="${y(v)}" r="5" fill="${c}" stroke="var(--paper)" stroke-width="2"/><text x="${x(h)}" y="${k==="hi"?y(v)-10:y(v)+18}" text-anchor="middle" font-size="11" font-weight="700" fill="${c}">${lab}</text>`;}).join("");
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="12/25 廣島潮位曲線，10:46 滿潮 366 公分，16:46 乾潮 107 公分" style="font-family:var(--f-num)">
    ${stay}${grid}
    <path d="${area}" fill="var(--sea)" opacity=".45"/><path d="${d}" fill="none" stroke="var(--sea-deep)" stroke-width="2.5"/>
    ${band(250,"250 cm 以上：鳥居浮在海上","var(--sea-deep)",true)}${band(100,"100 cm 以下：可走到鳥居","var(--c-food)",false)}
    ${marks}${hours}</svg>`;
  const legend = t.marks.map(([k,lab,h,v])=>`<div class="${k}"><b>${k==="hi"?"滿潮":"乾潮"}</b><span>${lab}・${v} cm</span></div>`).join("");
  return `<div class="tide">
    <div class="tide-top"><h4>12/25 宮島潮汐</h4><span class="src">廣島港預測值（日本氣象廳），宮島時間相差約幾分鐘</span></div>
    <div class="tide-chart">${svg}</div>
    <div class="tide-legend">${legend}</div>
    <p>上午到神社時正好接近滿潮，可以看到大鳥居和迴廊浮在海上的樣子。退潮走到鳥居下面一般要潮位 100 cm 以下，這天傍晚最低只到 107 cm，比較難走過去。</p>
  </div>`;
}

  panel.innerHTML = `
    <div class="panel-head">
      <div><div class="jp">DAY ${i+1}・${esc(d.jp)}</div><h2>${esc(d.title)}</h2></div>
      <div class="badges">

      <ul class="plist">${DAY_PHR[d.key].map(id => phraseLi(byId(id), false)).join("")}</ul>
    </div>
    <div class="memo"><label for="memo-${d.key}">我的筆記（預約編號、想買的東西…只存在這台裝置）</label>
      <textarea id="memo-${d.key}" placeholder="例如：木曾路 19:00，預約編號 ____"></textarea></div>
    <div class="nav">
      <button type="button" id="prev" ${i===0?"disabled":""}>← 前一天</button>
      <button type="button" id="next" ${i===DAYS.length-1?"disabled":""}>下一天 →</button>
    </div>`;
  const ta = panel.querySelector("textarea");
  ta.value = store.get(memoKey) || "";
  ta.addEventListener("input", () => store.set(memoKey, ta.value));
  panel.querySelectorAll(".check input").forEach(c => c.addEventListener("change", () => store.set("hiro-chk-"+c.dataset.ci, c.checked?"1":"0")));
  panel.querySelector("#prev").addEventListener("click", () => show(i-1,true));
  panel.querySelector("#next").addEventListener("click", () => show(i+1,true));
  bindSay(panel);
  panel.querySelector("#more").addEventListener("click", () => scrollToEl(document.getElementById("phrases")));
  if (animate) scrollToEl(panel, true);
  panel.querySelectorAll(".timeline > li").forEach((li,n) => li.style.animationDelay = (n*45)+"ms");
  panel.classList.remove("swap"); if (animate){ void panel.offsetWidth; panel.classList.add("swap"); }
  store.set("hiro-day", String(i));
  try{ history.replaceState(null,"","#"+d.key); }catch(e){}
}

const daybar = document.getElementById("daybar");
const reduceMotion = () => { try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } };
// Scroll so el sits just under the sticky day bar; with onlyIfAbove, only when its top is hidden
function scrollToEl(el, onlyIfAbove){
  // Where the bar's bottom edge sits once stuck (its sticky top + its height), plus breathing room
  const stickyTop = parseFloat(getComputedStyle(daybar).top) || 0;
  const offset = stickyTop + daybar.offsetHeight + 16;
  const top = el.getBoundingClientRect().top;
  if (onlyIfAbove && top >= offset) return;
  window.scrollTo({ top: top + window.scrollY - offset, behavior: reduceMotion() ? "auto" : "smooth" });
}
function updateStuck(){
  const stickyTop = parseFloat(getComputedStyle(daybar).top) || 0;
  daybar.classList.toggle("stuck", daybar.getBoundingClientRect().top <= stickyTop + 1 && window.scrollY > 0);
}
window.addEventListener("scroll", updateStuck, { passive:true });
window.addEventListener("resize", updateStuck);
updateStuck();

function speak(text){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/〇〇/g,"なになに"));
    u.lang = "ja-JP"; u.rate = .85;
    const v = speechSynthesis.getVoices().find(v => /^ja/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

// Ask for every glyph the page can show, so all font subsets get fetched (and cached for offline use)
try{
  const allText = JSON.stringify(DAYS) + JSON.stringify(PHRASES) + document.body.innerText;
  ["Huninn","Chiron GoRound TC","Zen Maru Gothic"].forEach(f => {
    document.fonts.load(`16px "${f}"`, allText).catch(()=>{});
    document.fonts.load(`700 16px "${f}"`, allText).catch(()=>{});
  });
}catch(e){}

let start = 0;
const h = (location.hash||"").slice(1);
const fromHash = DAYS.findIndex(d => d.key===h);
if (fromHash>=0) start = fromHash;
else { const s = parseInt(store.get("hiro-day"),10); if (s>=0 && s<DAYS.length) start = s; }
show(start, false);
</script>

<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("./sw.js").catch(function(){});
}
</script>
